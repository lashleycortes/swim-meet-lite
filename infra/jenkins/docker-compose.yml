services:
  jenkins:
    build: .
    container_name: jenkins
    # Classroom/lab only: Docker socket access effectively grants host Docker control.
    user: root
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
